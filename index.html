<main>
<header class="top">
 <div class="brand">
  <img class="logo" alt="Audiovida soluções auditivas" src="Logo%20(1).png" onerror="this.onerror=function(){this.onerror=function(){this.style.display='none'};this.src='Logo.png'};this.src='Logo_1.png'">

 </div>
 <div class="ctl">
  <div class="tabrow"><select id="year" class="yr" aria-label="Ano"></select><div class="tabs" id="tabs"></div></div>
  <div class="sync" role="status" aria-live="polite"><span class="dot" id="dot"></span><span class="syncmsg" id="st">carregando…</span><button type="button" class="refresh" id="rf">Atualizar agora</button></div>
 </div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQj0nUuuN100lJWxfnJmD9E33Q79MNiHBHaLXV9Wwtx2yf3biD_EkuFvHJO5qQdeGgcRr4uetl_fdme/pub?gid=1632344748&single=true&output=csv";
/* SINCRONIZAÇÃO. LIVE_URL = endereço do Apps Script (ver instruções): atualiza em poucos segundos.
   Se estiver vazio ou falhar, o painel usa a planilha publicada (CSV_URL), que o Google atualiza com atraso de alguns minutos. */
const LIVE_URL = "https://script.google.com/macros/s/AKfycby3RRF_GT1_0Von2cWjDKkhY-yFMhDgk7JPdZ0mHh89HQWubaTTKG0NyLkSv8PrqCB9-g/exec";
const POLL_LIVE_MS = 10000, POLL_CSV_MS = 30000, POLL_MAX_MS = 60000;
/* Regra da taxa de comparecimento: false = elegíveis são TODOS os agendamentos do mês (regra atual do SDR).
   true = elegíveis são os agendamentos menos os desmarcados. */
const EXCLUIR_DESMARCADOS_NA_TAXA = false;
/* Meses do painel. Cada mês traz o ano (y) e as colunas da aba "Resumo público". Para incluir dezembro ou 2027:
   adicionar uma linha aqui, com k no formato "AAAA-MM", e as colunas/fórmulas correspondentes na planilha. */
const MONTHS=[
 {k:"2026-11",y:2026,mo:10,label:"Novembro",mm:"11",days:30,ci:2,da:2,dc:4,ua:9,ul:11},
 {k:"2026-10",y:2026,mo:9,label:"Outubro",mm:"10",days:31,ci:1,da:1,dc:3,ua:8,ul:10}
];
/* Anos do seletor. Para 2028 e seguintes, basta incluir o ano aqui. */
const YEARS=[2026,2027];
const monthsOf=y=>MONTHS.filter(m=>m.y===y);
const defTab=y=>{const ms=monthsOf(y);return ms.length?ms.reduce((a,b)=>b.mo>a.mo?b:a).k:""};
let year=YEARS.includes(new Date().getFullYear())?new Date().getFullYear():YEARS[0];
let DEZ=[]; let D=null, R=[], tab=defTab(year), unit="", range=0, CV=null, view="unit", fFono="", fOrig="";
const $=s=>document.querySelector(s);
const n=v=>{v=parseFloat(String(v||"0").replace(",","."));return isNaN(v)?0:v};
const pct=(a,b)=>b>0?Math.round(a/b*1000)/10:0;
const f1=x=>String(x).replace(".",",")+"%";
const pad=x=>String(x).padStart(2,"0");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mo=k=>MONTHS.find(x=>x.k===k);

function csv(t){const r=[];let row=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==","){row.push(c);c=""}else if(ch=="\n"){row.push(c);r.push(row);row=[];c=""}else if(ch!="\r")c+=ch}row.push(c);r.push(row);return r}
function parse(g){
 const cell=(r,c)=>(g[r-1]||[])[c]||"";
 const out={};
 MONTHS.forEach(M=>{
  const ind={};
  [[2,11],[47,55]].forEach(([a,b])=>{for(let r=a;r<=b;r++){const nm=cell(r,0);if(nm)ind[nm]=n(cell(r,M.ci))}});
  const dia=[];for(let r=14;r<=44;r++)dia.push({d:n(cell(r,0)),a:n(cell(r,M.da)),c:n(cell(r,M.dc))});
  const un=[];for(let r=2;r<=8;r++)if(cell(r,6))un.push({nome:cell(r,6),a:n(cell(r,M.ua)),l:n(cell(r,M.ul))});
  const aud={},perfil={},status={};
  for(let r=2;r<=g.length;r++){if(cell(r,14)!==M.k)continue;const bl=cell(r,13),ch=cell(r,15),q=n(cell(r,16));if(bl==="aud")aud[ch]=q;else if(bl==="perfil")perfil[ch]=q;else if(bl==="status")status[ch]=q}
  out[M.k]={ind,dia,un,aud,perfil,status}});
 R=[];
 for(let r=59;r<=g.length;r++){const mes=cell(r,0);if(!/^\d{4}-\d{2}$/.test(mes))continue;const og=cell(r,3);R.push({k:mes,unit:cell(r,1).trim(),fono:cell(r,2).trim(),raw:og.trim(),og:OG(og),st:ST(cell(r,4)),n:n(cell(r,5))})}
 DEZ=[];for(let r=2;r<=g.length;r++){const d=cell(r,18);if(/^\d{2}\/12\/\d{4}$/.test(d))DEZ.push({d,u:cell(r,19).trim(),f:cell(r,20).trim()})} return out}

/* ---------- registros agregados (mês × unidade × fonoaudióloga × origem × status) ---------- */
const ST=s=>{s=String(s||"").toLowerCase();return s.includes("compareceu")?"comp":/n-?show|no-show|faltou|falta/.test(s)?"falt":s.includes("desmarc")?"desm":"pend"};
const OGL={meta_form:"Meta Ads — formulário",meta:"Meta Ads — sem detalhar",ads:"Anúncios (sem dizer qual)",google:"Google Ads",indic:"Indicação",outra:"Outras origens",nd:"Origem não informada"};
const OG=s=>{s=String(s||"").trim().toLowerCase();if(!s)return"nd";if(/form/.test(s))return"meta_form";if(/google|adwords/.test(s))return"google";if(/meta|facebook|instagram|\bfb\b|\big\b/.test(s))return"meta";if(/ads|an[uú]ncio|tr[aá]fego/.test(s))return"ads";if(/indica/.test(s))return"indic";return"outra"};
const filtersOn=()=>!!(unit||fFono||fOrig);
const recsOf=(k,skip)=>R.filter(r=>r.k===k&&(skip==="unit"||!unit||r.unit===unit)&&(skip==="fono"||!fFono||(fFono==="__none__"?!r.fono:r.fono===fFono))&&(skip==="orig"||!fOrig||r.og===fOrig));
const zero=()=>({ag:0,comp:0,falt:0,desm:0,pend:0});
function add(t,r){t.ag+=r.n;t[r.st]+=r.n;return t}
const aggAll=recs=>recs.reduce(add,zero());
function group(recs,fn){const m=new Map();recs.forEach(r=>{const key=fn(r);if(!m.has(key))m.set(key,zero());add(m.get(key),r)});return m}
const taxaOf=t=>pct(t.comp,EXCLUIR_DESMARCADOS_NA_TAXA?Math.max(0,t.ag-t.desm):t.ag);

/* ---------- métricas calculadas ---------- */
function calc(k,raw){
 const i=D[k].ind,g=x=>i[x]||0;
 const meta=g("conversas_meta"),goog=g("conversas_google"),lig=g("ligacoes_google"),form=g("leads_formulario");
 let ag=g("agendamentos"),comp=g("compareceram"),falt=g("faltaram"),desm=g("desmarcaram"),pend=g("aguardando");
 const fil=!raw&&filtersOn();
 if(fil){const t=aggAll(recsOf(k));ag=t.ag;comp=t.comp;falt=t.falt;desm=t.desm;pend=t.pend}
 const elig=EXCLUIR_DESMARCADOS_NA_TAXA?Math.max(0,ag-desm):ag;
 const eligAlt=EXCLUIR_DESMARCADOS_NA_TAXA?ag:Math.max(0,ag-desm);
 const sim=g("aud_sim"),nao=g("aud_nao"),valid=sim+nao;
 return {filtered:fil,meta,goog,lig,form,ag,comp,falt,desm,pend,elig,eligAlt,
  taxa:pct(comp,elig),taxaAlt:pct(comp,eligAlt),
  sim,nao,valid,naoInfo:g("aud_nao_informada"),qual:pct(sim,valid),
  eventos:g("forms_eventos"),comTel:g("forms_com_telefone"),semTel:g("forms_sem_telefone"),
  unicos:g("forms_unicos"),dup:g("forms_duplicados"),simUnicos:g("aud_sim_unicos"),
  oport:meta+goog+form,brutos:meta+goog+lig+form}}

/* ---------- dicas (mouse e toque) ---------- */
function hideTip(){$("#tip").style.display="none";const l=$("#cvl");if(l){l.style.display="none";$("#cva").style.display="none";$("#cvc").style.display="none"}}
function tipAt(lines,x,y){
 const t=$("#tip");t.innerHTML=lines.map((s,i)=>i?`<div>${esc(s)}</div>`:`<b>${esc(s)}</b>`).join("");
 t.style.display="block";
 const w=t.offsetWidth,h=t.offsetHeight;
 let left=Math.max(8,Math.min(window.innerWidth-w-8,x-w/2));
 let top=y-h-14;if(top<8)top=y+18;
 t.style.left=left+"px";t.style.top=top+"px"}
function tipFrom(e){if(!document.body.contains(e.target))return false;const t=e.target.closest&&e.target.closest("[data-tip]");if(!t)return false;tipAt(t.dataset.tip.split("|"),e.clientX,e.clientY);return true}
document.addEventListener("pointerover",e=>{if(e.pointerType==="mouse")tipFrom(e)});
document.addEventListener("pointermove",e=>{if(e.pointerType==="mouse"&&e.target.closest&&e.target.closest("[data-tip]"))tipFrom(e)});
document.addEventListener("pointerout",e=>{if(e.pointerType==="mouse"&&e.target.closest&&e.target.closest("[data-tip]"))hideTip()});
document.addEventListener("click",e=>{
 if(tipFrom(e))return;
 if(!(e.target.closest&&e.target.closest("#cv")))hideTip()});
const TIP=(...l)=>esc(l.join("|"));

/* ---------- 1. quatro indicadores principais ---------- */
function priCards(k){
 const c=calc(k);
 const tAg=TIP("Agendamentos","Consultas marcadas pelo SDR no mês (status “Agendado” nas abas de leads).","Inclui as que ainda não aconteceram, as faltas e as desmarcações.");
 const tRe=TIP("Agendamentos realizados","Pacientes agendados que efetivamente compareceram à consulta (status “Compareceu”).");
 const regra=EXCLUIR_DESMARCADOS_NA_TAXA?"Elegíveis = agendamentos do mês menos os desmarcados.":"Elegíveis = todos os agendamentos do mês (faltas, desmarcações e pendentes entram no total).";
 const alt=EXCLUIR_DESMARCADOS_NA_TAXA?`Sem excluir desmarcados seria ${f1(c.taxaAlt)} (${c.comp} ÷ ${c.eligAlt}).`:`Excluindo os desmarcados seria ${f1(c.taxaAlt)} (${c.comp} ÷ ${c.eligAlt}).`;
 const tTx=TIP("Taxa de comparecimento","Fórmula: agendamentos realizados ÷ agendamentos elegíveis × 100.",regra,alt);
 const tQ=TIP("Leads qualificados (%)","Leads de formulário que informaram ter exame de audiometria (menos de 1 ano).","Fórmula: leads com audiometria ÷ leads de formulário com resposta válida × 100.","Respostas em branco ou desconhecidas não são contadas nem como qualificadas nem como negativas.");
 const P=(cls,lab,tip,big,sub,extra)=>`<div class="pri ${cls}"><div class="ph"><span class="kpi-label">${lab}</span><button type="button" class="ib" data-tip="${tip}" aria-label="Explicação: ${esc(lab)}">i</button></div><span class="pbig" data-tip="${tip}">${big}</span><span class="mut">${sub}</span>${extra||""}</div>`;
 const bar=(a,b,cor)=>`<div class="pbar"><i style="width:${b>0?Math.min(100,a/b*100):0}%;background:${cor}"></i></div>`;
 return `<div class="pgrid">`+
  P("p1","Agendamentos",tAg,c.ag,"consultas marcadas pelo SDR no mês")+
  P("p2","Agend. realizados",tRe,c.comp,"pacientes que compareceram",bar(c.comp,c.ag,"var(--comp)"))+
  P("p3","Taxa de comparecimento",tTx,f1(c.taxa),`<span class="n">${c.comp}</span> ÷ <span class="n">${c.elig}</span> agendamentos elegíveis`,bar(c.comp,c.elig,"var(--teal)"))+
  P("p4","Leads qualificados",tQ,f1(c.qual),`<span class="n">${c.sim}</span> de <span class="n">${c.valid}</span> leads com resposta válida têm audiometria`,bar(c.sim,c.valid,"#127f79"))+
  `</div>`}

/* ---------- 2. canais de aquisição ---------- */
function channels(k){
 const c=calc(k);
 const row=(lab,val,tip,sub,na,flag)=>`<div class="crow"><div class="l"><b>${lab}${flag?`<em class="flag">${flag}</em>`:""}<button type="button" class="ib" data-tip="${tip}" aria-label="Explicação: ${esc(lab)}">i</button></b><span class="mut">${sub}</span></div><span class="v${na?" na":""}" data-tip="${tip}">${val}</span></div>`;
 const meta=`<div class="chan meta"><header><span>META ADS</span><small>Facebook e Instagram</small></header>`+
  row("Conversas iniciadas",c.meta,TIP("Conversas iniciadas (Meta)","Quantidade de conversas iniciadas a partir dos anúncios da Meta, conforme os eventos registrados.","Evento: “Messaging Conversations Started” (WhatsApp ou Messenger)."),"conversas por mensagem iniciadas pelos anúncios")+
  row("Leads de formulários instantâneos",c.form,TIP("Leads de formulários instantâneos (Meta)","Quantidade de pessoas que preencheram e enviaram formulários instantâneos nas campanhas da Meta.","Evento: cadastro Lead Ads (formulário “FORM QUALIFY”), contado por envio."),"cadastros nos formulários do Facebook e Instagram")+
  `</div>`;
 const goog=`<div class="chan goog"><header><span>GOOGLE ADS</span><small>Pesquisa e ligações</small></header>`+
  row("Ligações telefônicas",c.lig,TIP("Ligações telefônicas (Google)","Quantidade de ligações telefônicas registradas como conversões das campanhas do Google Ads.","Evento: “Phone calls” do relatório do Google Ads."),"ligações direto dos anúncios do Google")+
  row("Conversas iniciadas",c.goog,TIP("Conversões do Google Ads","Quantidade de contatos registrados como conversão nas campanhas do Google Ads.","Atenção: a planilha traz um único campo “Conversions” e não separa conversas de WhatsApp de outros tipos de conversão."),"conversões registradas nos anúncios do Google",false,"dado parcial")+
  row("Leads de formulários do site","—",TIP("Leads de formulários do site","Quantidade de pessoas que preencheram o formulário do site e foram atribuídas às campanhas do Google Ads.","Sem dado: a planilha não tem uma aba com envios do formulário do site nem a atribuição ao Google."),"não há esta informação na planilha",true,"sem dado")+
  `</div>`;
 return `<div class="chans">${meta}${goog}</div><div class="card"><div class="ph" style="display:flex;justify-content:space-between;gap:8px;align-items:center"><h3>Oportunidades geradas</h3><button type="button" class="ib" data-tip="${TIP("Oportunidades geradas","Soma de: conversas iniciadas da Meta + formulários da Meta + conversões do Google Ads.","Ligações do Google ficam de fora e são mostradas à parte.","É uma soma de eventos: a mesma pessoa pode aparecer em mais de um canal.")}" aria-label="Explicação: oportunidades geradas">i</button></div><div class="sgrid"><div class="stat" data-tip="${TIP("Oportunidades geradas","Meta (conversas + formulários) + conversões do Google.")}"><b>${c.oport}</b><span>total de oportunidades (eventos)</span></div><div class="stat" data-tip="${TIP("Meta Ads","Conversas iniciadas + leads de formulário da Meta.")}"><b>${c.meta+c.form}</b><span>Meta Ads: conversas + formulários</span></div><div class="stat" data-tip="${TIP("Google Ads","Conversões do Google Ads (ligações não entram).")}"><b>${c.goog}</b><span>Google Ads: conversões</span></div></div><p class="mut">Os formulários da base são todos da Meta (Lead Ads). Eles não são tratados como um terceiro canal: aparecem dentro do bloco Meta Ads.</p></div>`}

/* ---------- 3. qualidade dos leads ---------- */
function quality(k){
 const c=calc(k),tot=Math.max(1,c.valid+c.naoInfo);
 const seg=(v,cor,t)=>v>0?`<i style="width:${v/tot*100}%;background:${cor}" data-tip="${esc(t)}"></i>`:"";
 const S=(b,lab,tip)=>`<div class="stat" data-tip="${tip}"><b>${b}</b><span>${lab}</span></div>`;
 return `<div class="card"><div class="qhead"><div><h3>Qualidade dos leads</h3><span class="mut">Exame de audiometria informado nos formulários da Meta</span></div><div style="text-align:right"><div class="qbig" data-tip="${TIP("Taxa de qualificação","Leads com audiometria ÷ leads com resposta válida × 100.",c.sim+" de "+c.valid+" respostas válidas.")}">${f1(c.qual)}</div><span class="mut">taxa de qualificação</span></div></div>`+
  `<div class="pbar" style="height:16px">${seg(c.sim,"#127f79","Com audiometria|"+c.sim+" leads|"+f1(pct(c.sim,c.valid))+" das respostas válidas")}${seg(c.nao,"var(--pend)","Sem audiometria|"+c.nao+" leads|"+f1(pct(c.nao,c.valid))+" das respostas válidas")}${seg(c.naoInfo,"var(--desm)","Não informadas|"+c.naoInfo+" registros sem resposta válida")}</div>`+
  `<div class="sgrid">`+
  S(c.sim,"com audiometria (qualificados)",TIP("Leads com audiometria","Responderam “sim, tenho o exame recente”."))+
  S(c.nao,"sem audiometria",TIP("Leads sem audiometria","Responderam que não têm o exame (com ou sem interesse em realizar).","Não são tratados como qualificados."))+
  S(c.naoInfo,"respostas não informadas",TIP("Respostas não informadas","Formulários com a resposta em branco ou fora das opções esperadas.","Ficam fora do cálculo da taxa e não são contados como negativos."))+
  S(c.valid,"com resposta válida",TIP("Leads com resposta válida","Base da taxa: leads com audiometria + leads sem audiometria."))+
  S(c.simUnicos,"pessoas únicas qualificadas",TIP("Pessoas únicas qualificadas","Telefones diferentes entre os leads com audiometria.","Evita contar duas vezes a mesma pessoa que enviou o formulário mais de uma vez."))+
  `</div><p class="mut">Campo usado: “você possui um exame de audiometria realizado há menos de 1 ano?” dos formulários da Meta. Nada foi deduzido de outros campos. Hoje a base só tem formulários da Meta; formulários do site não existem na planilha.</p></div>`}

/* ---------- 4. leads únicos e duplicidades ---------- */
function dups(k){
 const c=calc(k);
 const S=(b,lab,tip,flag)=>`<div class="stat" data-tip="${tip}"><b>${b}</b><span>${lab}${flag?`<em class="flag">${flag}</em>`:""}</span></div>`;
 return `<div class="card"><h3>Leads únicos e duplicidades</h3><span class="mut">Telefone normalizado (últimos 9 dígitos) como chave de comparação</span><div class="sgrid">`+
  S(c.brutos,"eventos de conversão (brutos)",TIP("Eventos de conversão","Conversas da Meta + formulários da Meta + ligações do Google + conversões do Google.","São contagens brutas dos canais: nenhuma duplicidade é subtraída aqui."))+
  S(c.eventos,"leads de formulário captados",TIP("Leads captados (formulários)","Cada envio de formulário da Meta é um evento, mesmo que seja da mesma pessoa."))+
  S(c.unicos,"leads únicos (formulários)",TIP("Leads únicos","Telefones diferentes entre os envios de formulário do mês.","Só formulários têm telefone na planilha, então a contagem não cruza com conversas nem ligações."))+
  S(c.dup,"contatos duplicados",TIP("Contatos duplicados","Envios de formulário cujo telefone já apareceu antes no mês.","= envios com telefone − telefones únicos."))+
  S(c.semTel,"sem telefone válido",TIP("Sem telefone válido","Envios sem telefone ou com telefone curto demais para comparar.","Para esses não se presume duplicidade."))+
  `</div><p class="mut">Conversas iniciadas e ligações não trazem telefone na planilha. Por isso não dá para confirmar que a mesma pessoa conversou no WhatsApp e depois preencheu um formulário. Os indicadores brutos dos canais não são reduzidos por duplicidade.</p></div>`}

/* ---------- consultas, curva, unidades, comparativo ---------- */
function statusSeg(c){return [["Compareceram","comp",c.comp],["Faltaram","falt",c.falt],["Desmarcaram","desm",c.desm],["Aguardando","pend",c.pend]]}
function statusTiles(k){
 const c=calc(k),seg=statusSeg(c);
 const sub={comp:"foram à consulta",falt:"agendaram e não vieram",desm:"cancelaram a consulta",pend:"consulta ainda não aconteceu ou sem resultado lançado"};
 const names={comp:"Compareceram",falt:"Faltaram (no-show)",desm:"Desmarcaram",pend:"Aguardando a consulta"};
 return `<div class="status">${seg.map(s=>`<div class="tile st c-${s[1]}" data-tip="${TIP(s[0],s[2]+" de "+c.ag+" agendamentos",f1(pct(s[2],c.ag))+" do total")}"><span class="kpi-label">${names[s[1]]}</span><span class="mid">${s[2]}</span><span class="mut">${sub[s[1]]}</span></div>`).join("")}</div>`}
function consultas(k,u){
 const c=calc(k),seg=statusSeg(c),mx=Math.max(1,...seg.map(s=>s[2]));
 const tip=s=>TIP(s[0],s[2]+" de "+c.ag+" agendamentos",f1(pct(s[2],c.ag))+" do total");
 const cols=seg.map(s=>`<div class="col" style="--c:var(--${s[1]})" data-tip="${tip(s)}"><span class="v">${s[2]}</span><div class="b" style="height:${Math.max(2,s[2]/mx*130)}px"></div></div>`).join("");
 const labs=seg.map(s=>`<span data-tip="${tip(s)}">${s[0]}</span>`).join("");
const extra="";
 return `<div class="card"><h3>Como estão as consultas</h3><p class="mut">Taxa de comparecimento SDR: <span class="n">${f1(c.taxa)}</span> = <span class="n">${c.comp}</span> consultas realizadas ÷ <span class="n">${c.elig}</span> agendamentos elegíveis.</p><div class="cols">${cols}</div><div class="collab">${labs}</div><p class="mut">Passe o mouse (ou toque) em uma coluna para ver o detalhe. Consultas "aguardando" ainda não aconteceram ou não tiveram resultado lançado e contam como pendentes. Agendamento feito num mês pode ter consulta em outro.${extra}</p></div>`}

function curveData(k){
 const M=mo(k),now=new Date();let end;
 const start0=new Date(M.y,M.mo,1),inMonth=now.getFullYear()===M.y&&now.getMonth()===M.mo;
 if(inMonth)end=Math.min(M.days,now.getDate());else if(now<start0)end=0;else end=M.days;
 const start=range?Math.max(1,end-range+1):1;
 let a=0,c=0;
 return D[k].dia.filter(x=>x.d>=start&&x.d<=end).map(x=>({d:x.d,da:x.a,dc:x.c,a:(a+=x.a),c:(c+=x.c)}))}
function curve(k,u){
 const pts=curveData(k),N=pts.length,mm=mo(k).mm;
 const btn=[[7,"Últimos 7 dias"],[14,"Últimos 14 dias"],[0,"Mês todo"]].map(r=>`<button data-range="${r[0]}" class="${range===r[0]?"on":""}">${r[1]}</button>`).join("");
 if(!N){CV=null;return `<div class="card"><h3>Curva de crescimento acumulada</h3><div class="rng">${btn}</div><p class="mut">Sem dados para o período.</p></div>`}
 const W=600,H=230,pl=34,pr=12,pt=12,pb=26;
 const mx=Math.max(1,...pts.map(p=>Math.max(p.a,p.c)));
 const X=i=>N<2?pl+(W-pl-pr)/2:pl+i*(W-pl-pr)/(N-1);
 const Y=v=>H-pb-v*(H-pb-pt)/mx;
 const path=s=>pts.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p[s]).toFixed(1)).join(" ");
 const yt=[...new Set([0,mx>=4?Math.round(mx/2):0,mx])];
 const grid=yt.map(v=>`<line x1="${pl}" y1="${Y(v)}" x2="${W-pr}" y2="${Y(v)}" stroke="#e1e8ed"/><text x="${pl-6}" y="${Y(v)+3}" font-size="10" fill="#5A5E5F" text-anchor="end">${v}</text>`).join("");
 const step=Math.ceil(N/7);
 const xl=pts.map((p,i)=>i%step===0?`<text x="${X(i)}" y="${H-8}" font-size="10" fill="#5A5E5F" text-anchor="middle">${pad(p.d)}/${mm}</text>`:"").join("");
 const dots=pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.a)}" r="2.5" fill="#1F5C85"/><circle cx="${X(i)}" cy="${Y(p.c)}" r="2.5" fill="#3FB3AD"/>`).join("");
 const last=pts[N-1];
 CV={pts,N,W,H,pl,pr,X,Y,mm};
 const extra=u?" A curva mostra o mês todo: a planilha não separa os dias por unidade.":"";
 return `<div class="card"><h3>Curva de crescimento acumulada (por dia da consulta)</h3><div class="rng">${btn}</div><svg id="cv" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Curva acumulada de agendamentos e comparecimentos">${grid}${xl}<path d="${path("a")}" fill="none" stroke="#1F5C85" stroke-width="2.5"/><path d="${path("c")}" fill="none" stroke="#3FB3AD" stroke-width="2.5"/>${dots}<line id="cvl" x1="0" y1="${pt}" x2="0" y2="${H-pb}" stroke="#5A5E5F" stroke-dasharray="3 3" style="display:none"/><circle id="cva" r="5.5" fill="#1F5C85" stroke="#fff" stroke-width="2" style="display:none"/><circle id="cvc" r="5.5" fill="#3FB3AD" stroke="#fff" stroke-width="2" style="display:none"/><rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/></svg><div class="legend"><span><i style="background:#1F5C85"></i>Agendamentos no período: ${last.a}</span><span><i style="background:#3FB3AD"></i>Compareceram no período: ${last.c}</span></div><p class="mut">Passe o mouse ou arraste o dedo sobre a curva para ver cada dia. Soma pela data da consulta; agendamentos com consulta em outro mês não aparecem nesta curva. O recorte "últimos dias" termina no dia de hoje (mês em andamento) ou no fim do mês.${extra}</p></div>`}
function bindCurve(){
 const s=$("#cv");if(!s||!CV)return;
 const show=e=>{
  const r=s.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*CV.W;
  let i=CV.N<2?0:Math.round((x-CV.pl)/((CV.W-CV.pl-CV.pr)/(CV.N-1)));
  i=Math.max(0,Math.min(CV.N-1,i));const p=CV.pts[i],cx=CV.X(i);
  const l=$("#cvl"),a=$("#cva"),c=$("#cvc");
  l.setAttribute("x1",cx);l.setAttribute("x2",cx);l.style.display="";
  a.setAttribute("cx",cx);a.setAttribute("cy",CV.Y(p.a));a.style.display="";
  c.setAttribute("cx",cx);c.setAttribute("cy",CV.Y(p.c));c.style.display="";
  tipAt(["Dia "+pad(p.d)+"/"+CV.mm,"Consultas agendadas para o dia: "+p.da+" (acumulado: "+p.a+")","Compareceram no dia: "+p.dc+" (acumulado: "+p.c+")"],r.left+cx/CV.W*r.width,r.top+CV.Y(Math.max(p.a,p.c))/CV.H*r.height)};
 s.addEventListener("pointermove",show);
 s.addEventListener("pointerdown",show);
 s.addEventListener("pointerleave",e=>{if(e.pointerType==="mouse")hideTip()})}

function units(k,u){
 const rows=[...D[k].un].sort((x,y)=>y.l-x.l||y.a-x.a||x.nome.localeCompare(y.nome));
 const mx=Math.max(1,...rows.map(x=>Math.max(x.l,x.a)));
 const list=rows.map(x=>{
  const cv=x.l>0?pct(x.a,x.l):null;
  const tip=TIP(...[x.nome,"Leads de formulário: "+x.l,"Agendamentos: "+x.a,cv===null?"Conversão: sem leads de formulário no mês":"Conversão: "+f1(cv)+" (agendamentos ÷ leads de formulário)",cv>100?"Acima de 100%: há mais agendamentos do que leads de formulário contabilizados nesta fonte; parte dos agendamentos vem de outros canais.":""].filter(Boolean));
  return `<div class="ur${u&&u.nome===x.nome?" sel":""}" data-unit="${esc(x.nome)}" data-tip="${tip}" role="button" tabindex="0" aria-label="Filtrar por ${esc(x.nome)}"><div class="un">${esc(x.nome)}</div><div class="ub"><div class="bl"><span class="tr"><i style="width:${x.l/mx*100}%;background:var(--navy)"></i></span><b>${x.l}</b></div><div class="bl"><span class="tr"><i style="width:${x.a/mx*100}%;background:var(--teal)"></i></span><b>${x.a}</b></div></div><div class="uc">${cv===null?"—":f1(cv)}<small>conversão</small></div></div>`}).join("");
 return `<div class="card"><h3>Demanda por unidade</h3><div class="legend"><span style="cursor:default"><i style="background:var(--navy)"></i>Leads de formulário</span><span style="cursor:default"><i style="background:var(--teal)"></i>Agendamentos</span><span style="cursor:default">Conversão = agendamentos ÷ leads de formulário</span></div><div class="ugrid">${list}</div><p class="mut">Ordenado pelo maior volume de leads de formulário. Toque ou clique numa unidade para filtrar o painel. Leads de formulário e agendamentos vêm de fontes diferentes; a comparação por unidade é indicativa, e conversões acima de 100% não são limitadas.</p></div>`}
function unitBlock(k,u){
 const c=calc(k,true),totAg=c.ag,totLe=c.form;
 const tg=`<em class="tag tu">filtrado: ${esc(u.nome)}</em>`;
 const T=(lab,big,sub)=>`<div class="tile"><span class="kpi-label">${lab}</span><span class="big">${big}</span><span class="mut">${sub}</span>${tg}</div>`;
 return `<div class="unitbox"><h3>Unidade: ${esc(u.nome)}<small>números filtrados por unidade</small></h3><div class="hero">${T("Leads de formulário",u.l,"leads desta unidade no mês")}${T("Agendamentos",u.a,"consultas marcadas nesta unidade")}${T("Conversão",u.l>0?f1(pct(u.a,u.l)):"—","agendamentos ÷ leads de formulário")}${T("Participação",totAg>0?f1(pct(u.a,totAg)):"—","parte dos agendamentos do mês")}</div><p class="mut">Comparação: a conversão geral do mês (todas as unidades) é ${totLe>0?f1(pct(totAg,totLe)):"—"} (${totAg} agendamentos ÷ ${totLe} leads de formulário). A conversão é indicativa: leads de formulário e agendamentos vêm de fontes diferentes.</p></div>`}

function donut(k,title,raw){
 const c=calc(k,raw),a=c.ag,seg=statusSeg(c);
 const R=44,C=2*Math.PI*R;let off=0;
 const tip=s=>TIP(title,s[0]+": "+s[2]+" de "+a+" agendamentos",f1(pct(s[2],a))+" do total");
 let arcs=`<circle cx="60" cy="60" r="${R}" fill="none" stroke="#e1e8ed" stroke-width="14"/>`;
 seg.forEach(s=>{if(s[2]>0&&a>0){const len=s[2]/a*C;arcs+=`<circle data-tip="${tip(s)}" cx="60" cy="60" r="${R}" fill="none" style="stroke:var(--${s[1]});cursor:pointer" stroke-width="14" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=len}});
 return `<div class="card dcard"><h3>${esc(title)}</h3><svg class="dsvg" viewBox="0 0 120 120" role="img" aria-label="${esc(title)}: ${f1(c.taxa)} de comparecimento">${arcs}<text x="60" y="54" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="700" fill="#1F5C85">${f1(c.taxa)}</text><text x="60" y="71" text-anchor="middle" dominant-baseline="central" font-size="7" fill="#5A5E5F">comparecimento</text></svg><div class="legend" style="justify-content:center">${seg.map(s=>`<span data-tip="${tip(s)}"><i style="background:var(--${s[1]})"></i>${s[0]}: ${s[2]}</span>`).join("")}</div><p class="mut">${c.comp} compareceram de ${c.elig} agendamentos elegíveis. Toque ou passe o mouse nas fatias.</p></div>`}
function cmp(){
 const now=new Date(),ms=monthsOf(year).slice().sort((x,y)=>x.mo-y.mo),cs=ms.map(m=>calc(m.k,true));
 const open=m=>now.getFullYear()===m.y&&now.getMonth()===m.mo;
 const dn=ms.map(m=>donut(m.k,m.label+" "+m.y+(open(m)?" (até hoje)":" (mês todo)"),true)).join("");
 const L=[["Agendamentos",c=>c.ag],["Agendamentos realizados",c=>c.comp],["Taxa de comparecimento",c=>f1(c.taxa)],["Aguardando",c=>c.pend],["Leads qualificados (%)",c=>f1(c.qual)],["Leads com audiometria",c=>c.sim],["Leads sem audiometria",c=>c.nao],["Respostas não informadas",c=>c.naoInfo],["Meta: conversas iniciadas",c=>c.meta],["Meta: leads de formulário",c=>c.form],["Google: ligações",c=>c.lig],["Google: conversões",c=>c.goog],["Leads únicos (formulários)",c=>c.unicos],["Contatos duplicados",c=>c.dup]];
 return `<div class="dgrid">${dn}</div><div class="card"><div class="tw"><table><thead><tr><th>Indicador</th>${ms.map(m=>`<th>${m.label}</th>`).join("")}</tr></thead><tbody>${L.map(r=>`<tr><td>${r[0]}</td>${cs.map(c=>`<td>${r[1](c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div><p class="mut">Mês em andamento tem consultas aguardando, o que reduz a taxa parcial: compara-se mês fechado com mês aberto. O filtro de unidade não se aplica ao comparativo.</p></div>`}

const NOTA=`<div class="card info"><h3>Sobre os dados e limitações</h3><ul>
<li>Os números de consultas (agendamentos, comparecimentos, faltas, desmarcações) e as visões por unidade, fonoaudióloga e origem vêm da tabela agregada da aba "Resumo público" e respondem aos filtros. A curva por dia, os canais de aquisição e a qualidade dos leads são do mês todo: a planilha não cruza esses números com unidade, fonoaudióloga ou origem.</li>
<li>Origem do agendamento é um campo de texto livre preenchido pela equipe (coluna "Origem" das abas de leads). Quando está em branco, o agendamento aparece como "Origem não informada": nada é atribuído por dedução. A conversão por origem fica subestimada enquanto o preenchimento for baixo.</li>
<li>Cada atualização recalcula tudo a partir da planilha, sem acumular registros: edições, correções e exclusões feitas na planilha aparecem no painel e não geram contagem em duplicidade.</li>
<li>Todos os formulários da base são formulários instantâneos da Meta. Não há na planilha envios do formulário do site nem a atribuição ao Google Ads.</li>
<li>O Google Ads informa um único campo de conversões, sem separar WhatsApp de outros tipos. Por isso o card do Google mostra “conversões” e marca o dado como parcial.</li>
<li>Conversas iniciadas e ligações não têm telefone na planilha: leads únicos e duplicados são calculados só entre os formulários.</li>
</ul></div>`;
const WARN=`<div class="card warn"><h3>Como ler este painel</h3><p class="mut">"Conversas iniciadas" e "Leads de formulário" são métricas diferentes. Uma mesma pessoa pode aparecer nas duas, então a soma (oportunidades) pode ter pequena sobreposição. Ligações do Google Ads são mostradas à parte e não entram nas oportunidades.</p></div>`;

/* ---------- análise dos agendamentos: unidade, fonoaudióloga, origem ---------- */
const fonoKey=r=>r.fono||"__none__";
const fonoName=k=>k==="__none__"?"Sem fonoaudióloga registrada":k;
const tipRow=(name,t,extra)=>TIP(...[name,"Agendamentos: "+t.ag,"Realizadas: "+t.comp+" · Aguardando: "+t.pend,"Faltaram: "+t.falt+" · Desmarcaram: "+t.desm,t.ag?"Taxa de comparecimento: "+f1(taxaOf(t)):"",extra||""].filter(Boolean));
function chips(k){
 if(!filtersOn())return"";
 const c=(w,txt)=>`<span>${esc(txt)} <button type="button" data-clear="${w}" aria-label="Remover filtro">✕</button></span>`;
 return `<div class="fchips"><b>Filtros ativos:</b>${unit?c("unit","Unidade: "+unit):""}${fFono?c("fono","Fonoaudióloga: "+fonoName(fFono)):""}${fOrig?c("orig","Origem: "+OGL[fOrig]):""}<button type="button" data-clear="all">Limpar tudo</button></div><p class="mut">Agendamentos, comparecimento, taxas e as visões de análise foram recalculados com o filtro. Canais de aquisição, qualidade dos leads e a curva por dia seguem no total do mês, porque a planilha não cruza esses números por unidade, fonoaudióloga ou origem.</p>`}
const OGN={nd:"Não informado",indic:"Indicação",ads:"Anúncios (sem dizer qual)",meta:"Meta Ads",meta_form:"Meta forms",google:"Google Ads",outra:"Outras origens"};
const STATUS_LIST=["Agendado","Agendado / paciente resgate","Agendado / manual sou 2023","Encaminhado","Desqualificado","Fup"];
const PERFIS=["Fui orientado por um médico a usar aparelho","Já uso aparelho auditivo e quero atualizar","Percebo dificuldade auditiva, mas ainda não consultei","Apenas curiosidade"];
const prettyP=s=>{s=String(s||"").replace(/_/g," ").replace(/\.\s*$/,"").trim();return s.charAt(0).toUpperCase()+s.slice(1)};
const brows=(rows,attr,sel,ph)=>{const mx=Math.max(1,...rows.map(r=>r.v));
 return rows.length?`<div class="bars2">${rows.map(r=>`<div class="brow${sel&&sel===r.key?" sel":sel?" dim":""}" ${attr}="${esc(r.key)}" role="button" tabindex="0" data-tip="${tipRow(r.name,r.t)}"><span class="bn">${esc(r.name)}</span><span class="btk"><i style="width:${r.v/mx*100}%"></i></span><b class="bc">${r.v}</b></div>`).join("")}</div>`:`<p class="mut">${ph}</p>`};
function analysis(k){
 const A=D[k].aud||{},Pf=D[k].perfil||{},St=D[k].status||{};
 /* audiometria */
 const com=A.com||0,quer=A.quer||0,nao=A.nao||0,out=A.outro||0,tot=com+quer+nao+out;
 const seg=(v,c,t)=>v>0?`<i style="width:${v/tot*100}%;background:${c}" data-tip="${TIP(t,v+" leads",f1(pct(v,tot))+" do total")}"></i>`:"";
 const aud=`<div class="card"><h3 class="h17">Audiometria nos leads de formulário</h3><p class="d14">Resposta à pergunta "você possui um exame de audiometria realizado há menos de 1 ano?". Lead qualificado = quem tem o exame.</p>
<div class="stk">${seg(com,"#2e9e7a","Têm audiometria recente")}${seg(quer,"#e9a23b","Não têm, mas querem fazer")}${seg(nao,"#d9534f","Não têm e não pretendem fazer")}${seg(out,"#a7b3b8","Sem resposta ou outra resposta")}</div>
<table class="rtab"><thead><tr><th>Resposta</th><th class="num">Leads</th></tr></thead><tbody><tr><td>Têm audiometria recente</td><td class="num">${com}</td></tr><tr><td>Não têm, mas querem fazer</td><td class="num">${quer}</td></tr><tr><td>Não têm e não pretendem fazer</td><td class="num">${nao}</td></tr>${out?`<tr><td>Sem resposta ou outra resposta</td><td class="num">${out}</td></tr>`:""}<tr class="tt"><td>Total de leads de formulário</td><td class="num">${tot}</td></tr></tbody></table></div>`;
 /* perfil */
 const pm=new Map(PERFIS.map(p=>[p,0]));Object.keys(Pf).forEach(raw=>{const p=prettyP(raw);pm.set(p,(pm.get(p)||0)+Pf[raw])});
 const prow=[...pm.entries()].sort((a,b)=>b[1]-a[1]||PERFIS.indexOf(a[0])-PERFIS.indexOf(b[0]));
 const per=`<div class="card"><h3 class="h17">Perfil de quem preencheu o formulário</h3><p class="d14">Resposta a "como está a sua audição hoje?" (coluna O dos formulários). O percentual é sobre todos os leads de formulário do mês.</p>
<table class="rtab"><thead><tr><th>Perfil</th><th class="num">Leads</th><th class="num">%</th></tr></thead><tbody>${prow.map(([p,v])=>`<tr><td>${esc(p)}</td><td class="num">${v}</td><td class="num">${tot?f1(pct(v,tot)):"—"}</td></tr>`).join("")}</tbody></table></div>`;
 /* barras: unidade, fonoaudióloga, origem */
 const gU=group(recsOf(k,"unit"),r=>r.unit),gF=group(recsOf(k,"fono"),fonoKey),gO=group(recsOf(k,"orig"),r=>r.og);
 const toRows=(m,nm)=>[...m.entries()].filter(([key,t])=>key&&t.ag>0).map(([key,t])=>({key,name:nm(key),v:t.ag,t}));
 const byV=(a,b)=>b.v-a.v||a.name.localeCompare(b.name);
 const uR=toRows(gU,x=>x).sort(byV),fR=toRows(gF,k2=>k2==="__none__"?"Sem fonoaudióloga":k2).sort(byV);
 const oR=toRows(gO,x=>OGN[x]||x).sort(byV);
 const nd=(gO.get("nd")||zero()).ag,totO=aggAll(recsOf(k,"orig")).ag;
 const note=nd>0?`<p class="d14 nt">${nd} de ${totO} agendamentos estão sem origem (${f1(pct(nd,totO))}). Preencha a coluna I da planilha para o painel mostrar de onde veio cada paciente.</p>`:"";
 /* situação dos leads */
 const sm=new Map(STATUS_LIST.map(s=>[s,0]));let outro=0;Object.keys(St).forEach(s=>{const x=s.trim();if(sm.has(x))sm.set(x,St[s]);else if(/^agendado/i.test(x)||/^fup$/i.test(x)||/^encaminhado$/i.test(x)||/^desqualificado$/i.test(x))sm.set(x,(sm.get(x)||0)+St[s])});
 const srows=[...sm.entries()];
 const sit=`<div class="card"><h3 class="h17">Situação dos leads</h3><table class="rtab"><thead><tr><th>Status</th><th class="num">Leads</th></tr></thead><tbody>${srows.map(([s,v])=>`<tr><td>${s==="Fup"?"Follow-up (Fup)":esc(s)}</td><td class="num">${v}</td></tr>`).join("")}</tbody></table></div>`;
 return `${aud}${per}<div class="g2"><div class="card"><h3 class="h17">Por unidade</h3>${brows(uR,"data-unit",unit,"Sem agendamentos com este filtro.")}</div><div class="card"><h3 class="h17">Por fonoaudióloga</h3>${brows(fR,"data-fono",fFono,"Sem agendamentos com este filtro.")}</div><div class="card"><h3 class="h17">De onde vieram</h3>${brows(oR,"data-orig",fOrig,"Sem agendamentos com este filtro.")}${note}</div>${sit}</div>`}

/* ---------- render ---------- */
 function dezBanner(k,u){if(k!==MONTHS.reduce((a,b)=>b.mo>a.mo?b:a).k)return"";const L=DEZ.filter(x=>!u||x.u===u).sort((a,b)=>a.d.split("/").reverse().join().localeCompare(b.d.split("/").reverse().join()));if(!L.length)return"";return `<div class="dezb"><b>📅 ${L.length} agendamento${L.length>1?"s":""} já marcado${L.length>1?"s":""} para dezembro</b>${L.map(x=>`<span class="it"><i>${x.d.slice(0,5)}</i> ${esc(x.u)}${x.f?" · "+esc(x.f):""}</span>`).join("")}</div>`} unction monthPage(k,u){
 let h=chips(k);
 if(u)h+=unitBlock(k,u); h+=dezBanner(k,u);
 h+=`<div class="stitle">Indicadores principais</div>`+priCards(k);
 h+=`<div class="stitle">Consultas e comparecimento</div>`+statusTiles(k)+`<div class="dgrid">${donut(k,"Distribuição das consultas")}${consultas(k,u)}</div>`;
 h+=analysis(k);
 h+=`<div class="stitle">Canais de aquisição</div>`+channels(k);
 h+=`<div class="stitle">Qualidade e unicidade dos leads</div><div class="chans" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))">${quality(k)}${dups(k)}</div>`;
 h+=`<div class="stitle">Evolução</div>`+curve(k,u);
 h+=`<div class="stitle">Demanda por unidade</div>`+units(k,u);
 h+=`<div class="stitle">Notas</div>`+NOTA+WARN;
 return h}
function buildTabs(){
 const ms=monthsOf(year);
 $("#tabs").innerHTML=ms.map(M=>`<button data-t="${M.k}">${M.label}</button>`).join("")+(ms.length>1?`<button data-t="cmp">Comparativo</button>`:"");
 document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()})}
function fillUnits(){
 const s=$("#unit"),names=D[MONTHS[0].k].un.map(x=>x.nome);
 const cur=[...s.options].slice(1).map(o=>o.value);
 if(cur.join("|")!==names.join("|")){s.innerHTML='<option value="">Todas as unidades</option>'+names.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("")}
 if(unit&&!names.includes(unit))unit="";
 s.value=unit}
function render(){
 hideTip();
 const ms=monthsOf(year);
 if(tab==="cmp"&&ms.length<2)tab=defTab(year);
 if(tab!=="cmp"&&!ms.some(m=>m.k===tab))tab=defTab(year);
 document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
 $("#ctl").style.display=(tab==="cmp"||!ms.length)?"none":"flex";
 if(!D)return;
 const a=$("#app");
 if(!ms.length){CV=null;a.innerHTML=`<div class="card"><h3>Sem dados para ${year}</h3><p class="mut">Ainda não há dados de ${year} na planilha. Os números aparecem aqui assim que os meses de ${year} forem lançados e incluídos na aba "Resumo público". Nenhum número de outro ano é reaproveitado.</p></div>`;return}
 if(tab==="cmp"){CV=null;a.innerHTML=`<section class="sec">${cmp()}${NOTA}${WARN}</section>`;return}
 const u=unit?D[tab].un.find(x=>x.nome===unit):null;
 a.innerHTML=`<section class="sec">${monthPage(tab,u)}</section>`;bindCurve()}

$("#year").innerHTML=YEARS.map(y=>`<option value="${y}">${y}</option>`).join("");
$("#year").value=year;
$("#year").onchange=e=>{year=+e.target.value;tab=defTab(year);buildTabs();render()};
$("#app").addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.dataset&&(e.target.dataset.unit||e.target.dataset.fono||e.target.dataset.orig)){e.preventDefault();e.target.click()}});
buildTabs();
$("#unit").onchange=e=>{unit=e.target.value;render()};
$("#rf").onclick=()=>load();
$("#app").addEventListener("click",e=>{
 const v=e.target.closest("[data-view]");if(v){view=v.dataset.view;render();return}
 const c=e.target.closest("[data-clear]");if(c){const w=c.dataset.clear;if(w==="unit"||w==="all"){unit="";$("#unit").value=""}if(w==="fono"||w==="all")fFono="";if(w==="orig"||w==="all")fOrig="";render();return}
 const f=e.target.closest("[data-fono]");if(f){fFono=fFono===f.dataset.fono?"":f.dataset.fono;render();return}
 const o=e.target.closest("[data-orig]");if(o){fOrig=fOrig===o.dataset.orig?"":o.dataset.orig;render();return}
 const r=e.target.closest("[data-range]");
 if(r){range=+r.dataset.range;render();return}
 const u=e.target.closest("[data-unit]");
 if(u){unit=unit===u.dataset.unit?"":u.dataset.unit;$("#unit").value=unit;render()}});

/* ---------- sincronização com a planilha ---------- */
const SY={state:"loading",okAt:null,changedAt:null,mode:"",fails:0,sig:"",busy:false,timer:null,liveErr:false};
const hhmm=d=>d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
function paintSync(){
 const dot=$("#dot"),st=$("#st");
 dot.className="dot "+(SY.state==="ok"?"ok":SY.state==="error"?"err":"load");
 const src=SY.mode==="live"?"ao vivo (Apps Script)":SY.mode==="csv"?"planilha publicada (o Google pode levar alguns minutos para refletir mudanças)":"";
 let main,sub="";
 if(SY.state==="loading"&&!SY.okAt){main="Conectando à planilha…"}
 else if(SY.state==="loading"){main="Atualizando…";sub="última sincronização às "+hhmm(SY.okAt)}
 else if(SY.state==="error"){st.className="syncmsg bad";main="Sem conexão com a planilha";sub=SY.okAt?"exibindo dados de "+hhmm(SY.okAt)+", que podem estar desatualizados":"nenhum dado carregado";st.innerHTML=`<span>${main}</span><small>${sub}</small>`;return}
 else{main="Conectado · sincronizado às "+hhmm(SY.okAt);sub=(SY.changedAt?"dados alterados às "+hhmm(SY.changedAt)+" · ":"")+src+(SY.liveErr&&SY.mode==="csv"?" · modo reserva: Apps Script indisponível":"")}
 st.className="syncmsg";st.innerHTML=`<span>${main}</span><small>${sub}</small>`}
async function fetchText(url,ms){
 const ac=new AbortController(),t=setTimeout(()=>ac.abort(),ms);
 try{const r=await fetch(url+(url.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store",signal:ac.signal});if(!r.ok)throw new Error("HTTP "+r.status);return await r.text()}finally{clearTimeout(t)}}
async function getGrid(){
 if(LIVE_URL){try{const j=JSON.parse(await fetchText(LIVE_URL,12000));if(j&&Array.isArray(j.values)&&j.values.length){SY.mode="live";SY.liveErr=false;return j.values}throw new Error("resposta inválida")}catch(e){SY.liveErr=true}}
 SY.mode="csv";const g=csv(await fetchText(CSV_URL,15000));if(!g.length||!String(g[0][0]).includes("indicador"))throw new Error("CSV inesperado");return g}
async function load(){
 if(SY.busy)return;SY.busy=true;clearTimeout(SY.timer);
 SY.state="loading";paintSync();
 try{
  const g=await getGrid(),sig=JSON.stringify(g),first=!D;
  const nd=parse(g);
  if(first||sig!==SY.sig){D=nd;fillUnits();render();if(!first)SY.changedAt=new Date();SY.sig=sig}
  SY.okAt=new Date();SY.state="ok";SY.fails=0;
 }catch(e){SY.fails++;SY.state="error";if(!D)$("#app").innerHTML='<div class="err">Não foi possível carregar os dados da planilha. Tentando de novo automaticamente.</div>'}
 SY.busy=false;paintSync();schedule()}
function schedule(){
 clearTimeout(SY.timer);
 const base=SY.mode==="live"?POLL_LIVE_MS:POLL_CSV_MS,wait=SY.fails?Math.min(POLL_MAX_MS,base*Math.pow(2,SY.fails)):base;
 SY.timer=setTimeout(()=>{if(document.hidden){schedule();return}load()},wait)}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&(!SY.okAt||Date.now()-SY.okAt>8000))load()});
window.addEventListener("online",()=>load());
window.addEventListener("offline",()=>{SY.state="error";paintSync()});
load();
</script></body></html>
